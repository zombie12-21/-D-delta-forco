<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_OVERRIDE_MAINFRAME</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: rgba(0, 255, 0, 0.15);
            font-size: 12px;
            white-space: nowrap;
            z-index: -1;
            pointer-events: none;
        }

        .header {
            border-bottom: 2px solid #0f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0f0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .console-box {
            border: 1px solid #0f0;
            background: rgba(0, 20, 0, 0.8);
            padding: 15px;
            height: 250px;
            overflow-y: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            position: relative;
        }

        .console-box h3 {
            margin-top: 0;
            background: #0f0;
            color: #000;
            padding: 2px 5px;
            font-size: 14px;
        }

        .alert-box {
            grid-column: span 2;
            border: 2px dashed #f00;
            color: #f00;
            background: rgba(30, 0, 0, 0.9);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            animation: blink 1s infinite;
            text-shadow: 0 0 10px #f00;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .log-entry {
            margin: 4px 0;
            font-size: 13px;
            white-space: nowrap;
        }

        .progress-bar {
            width: 100%;
            background: #111;
            border: 1px solid #0f0;
            height: 20px;
            margin-top: 10px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #0f0;
            width: 0%;
            transition: width 0.1s linear;
        }

        @keyframes blink {
            0%, 49% { border-color: #f00; opacity: 1; }
            50%, 100% { border-color: transparent; opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- Fake falling matrix data code -->
    <div class="matrix-bg" id="matrix"></div>

    <div class="header">
        <h1>☠️ MAINFRAME BYPASS IN PROGRESS ☠️</h1>
        <div>TARGET_IP: 192.168.1.254 // DECRYPT_LEVEL: OMEGA // STATUS: EXECUTING...</div>
    </div>

    <div class="grid">
        <div class="alert-box">
            ⚠️ WARNING: INTRUSION DETECTED BY HOST FIRMWALL ⚠️
        </div>

        <div class="console-box">
            <h3>[ DIRECTORY_BYPASS_LOG ]</h3>
            <div id="log1"></div>
        </div>

        <div class="console-box">
            <h3>[ BRUTE_FORCE_CIPHER ]</h3>
            <div id="log2" style="color: #00bfff;"></div>
        </div>

        <div class="console-box" style="grid-column: span 2; height: 120px;">
            <h3>[ CORE_DATABASE_EXTRATION ]</h3>
            <div id="download-status">Extracting sensitive files... 0%</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
        </div>
    </div>

    <script>
        // Generate random fake matrix background lines
        const matrixEl = document.getElementById('matrix');
        let matrixText = '';
        for (let i = 0; i < 50; i++) {
            matrixText += Math.random().toString(36).substring(2, 15) + " " + Math.random().toString(36).substring(2, 15) + "<br>";
        }
        matrixEl.innerHTML = matrixText;

        // Fake terminal logging strings
        const logs1 = [
            "[OK] Initializing handshake...",
            "[INFO] Flooding port 8080 with dummy requests...",
            "[SUCCESS] Firewall bypassed successfully.",
            "[PING] TTL=42ms response from central database.",
            "[DIR] Accessing secret_files/dont_look/",
            "[BYPASS] Overriding admin privileges...",
            "[OK] Uploading remote exploit framework...",
            "[ALERT] Anti-virus attempting quarantine... Blocked.",
            "[INFO] Routing connection through 7 proxies...",
            "[SUCCESS] Root access granted."
        ];

        const ciphers = [
            "HEX::0x7F 0x3A 0x99 0x21 0x0B -> MATCH FOUND",
            "DECRYPTING KEYPAIRS... [ATTEMPT 4,201]",
            "HASH VALUE: \$2a\$12\$R9h/lHS... MATCH EXPIRED",
            "INJECTING SQL: SELECT * FROM users WHERE '1'='1'",
            "CIPHER BREAK: AES-256 block structure unlocked",
            "SALTING SHA-256 strings... SUCCESS",
            "COMPILING DEPENDENCIES... DONE",
            "BYPASSING TWO-FACTOR AUTHENTICATION TOKEN..."
        ];

        const log1Div = document.getElementById('log1');
        const log2Div = document.getElementById('log2');
        const progressFill = document.getElementById('progress');
        const downloadStatus = document.getElementById('download-status');

        // Infinite simulated printing loops
        setInterval(() => {
            const randomLine = logs1[Math.floor(Math.random() * logs1.length)];
            log1Div.innerHTML += `<div class="log-entry">${randomLine}</div>`;
            if (log1Div.children.length > 10) log1Div.removeChild(log1Div.children[0]);
        }, 600);

        setInterval(() => {
            const randomCipher = ciphers[Math.floor(Math.random() * ciphers.length)];
            log2Div.innerHTML += `<div class="log-entry">>> ${randomCipher}</div>`;
            if (log2Div.children.length > 10) log2Div.removeChild(log2Div.children[0]);
        }, 400);

        // Fake continuous progress bar loop
        let percent = 0;
        setInterval(() => {
            percent += Math.floor(Math.random() * 3) + 1;
            if (percent > 100) {
                percent = 0;
                downloadStatus.innerHTML = "🧹 Wiping event logs to clear tracks...";
            } else {
                downloadStatus.innerHTML = `Extracting corporate_secrets.zip... ${percent}%`;
            }
            progressFill.style.width = percent + '%';
        }, 150);
    </script>
</body>
</html>
